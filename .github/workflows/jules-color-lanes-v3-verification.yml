name: "Jules Color Lanes V3 Verification"

on:
  push:
    branches:
      - "verify/jules-color-lanes-v3-c263a25e"

permissions:
  contents: read

concurrency:
  group: jules-color-lanes-v3-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact verification commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Run focused color-lane tests
        run: |
          python -m unittest automation.command_bus.tests.test_loop_id_claim -v
          python -m unittest automation.command_bus.tests.test_jules_color_lane_spec -v
          python -m unittest automation.command_bus.tests.test_jules_semiauto_workflow -v
          python -m unittest automation.command_bus.tests.test_jules_api_request -v

      - name: Run command bus regression suite
        run: python -m unittest discover -s automation/command_bus/tests -t . -v

      - name: Compile command bus
        run: python -m compileall -q automation/command_bus

      - name: Diff whitespace check
        run: git diff --check a4e8bedd5276411acce1f89b12d8aa3c0ce905bb c263a25eaab341ebb6e3d2ecc04d198d5aeb5654
