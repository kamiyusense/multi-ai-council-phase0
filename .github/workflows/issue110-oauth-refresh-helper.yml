name: Issue 110 OAuth refresh helper prepare-only tests

on:
  push:
    branches:
      - prepare/issue110-oauth-refresh-helper-v1
    paths:
      - .github/workflows/issue110-oauth-refresh-helper.yml
      - automation/command_bus/claude_oauth_refresh_helper.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_helper.mjs

permissions:
  contents: read

jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run helper unit and crash-recovery tests
        shell: bash
        run: node --test automation/command_bus/tests/test_claude_oauth_refresh_helper.mjs

      - name: Verify CLI is prepare-only and unarmed run is blocked
        shell: bash
        run: |
          node automation/command_bus/claude_oauth_refresh_helper.mjs plan >/tmp/phase0-oauth-helper-plan.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/phase0-oauth-helper-plan.json"))
          assert p["mode"] == "PREPARE_ONLY"
          assert p["production_transport_wired"] is False
          assert p["retry"] == 0
          assert p["fallback"] == "disabled"
          assert p["secret_values_logged"] is False
          print("OAUTH_REFRESH_HELPER_PREPARE_ONLY_PASS")
          PY

          set +e
          node automation/command_bus/claude_oauth_refresh_helper.mjs run >/tmp/helper-run.out 2>/tmp/helper-run.err
          code=$?
          set -e
          test "$code" = "78"
          grep -F "production OAuth transport is not wired" /tmp/helper-run.err
          grep -F "no network request was attempted" /tmp/helper-run.err
          echo "OAUTH_REFRESH_HELPER_UNWIRED_NETWORK_BLOCK_PASS"

      - name: Syntax and diff checks
        shell: bash
        run: |
          node --check automation/command_bus/claude_oauth_refresh_helper.mjs
          node --check automation/command_bus/tests/test_claude_oauth_refresh_helper.mjs
          git diff --check
