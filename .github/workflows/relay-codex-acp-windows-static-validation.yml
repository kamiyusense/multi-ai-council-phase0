name: Phase 0 Relay codex-acp 2.1.0 Windows STATIC gate validation

# Windows-only addition to relay-codex-acp-static-validation.yml (Linux, unchanged).
# Official @agentclientprotocol/codex-acp@2.1.0 -> CODEX_PATH = Windows launcher
# (src/relay/codex_turn_gate.cmd) -> Relay one-generation gate -> fixture backend.
# No provider/model connection, no credentials, no npm lifecycle scripts, no optional
# (native Codex) packages. Same append-only request trigger; validates target_sha.

on:
  push:
    branches:
      - feature/chat-work-command-bus
    paths:
      - automation/command_bus/relay_validation_requests/*.json

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.locate.outputs.target_sha }}
    steps:
      - name: Checkout carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Locate one append-only validation request
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          commit_json="$(curl --fail-with-body --retry 0 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${REPOSITORY}/commits/${COMMIT_SHA}")"
          [[ "$(jq '.files | length' <<<"${commit_json}")" == "1" ]] || { echo "Expected exactly one file." >&2; exit 1; }
          [[ "$(jq -r '.files[0].status' <<<"${commit_json}")" == "added" ]] || { echo "Request must be append-only." >&2; exit 1; }
          path="$(jq -r '.files[0].filename' <<<"${commit_json}")"
          [[ "${path}" =~ ^automation/command_bus/relay_validation_requests/[a-z0-9][a-z0-9._-]{0,63}\.json$ ]] || { echo "Unexpected request path." >&2; exit 1; }
          target_sha="$(jq -er '.target_sha' "${path}")"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid target_sha." >&2; exit 1; }
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"

  windows:
    needs: locate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Relay head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.locate.outputs.target_sha }}
          persist-credentials: false

      - name: Select - does this target carry the tests this workflow validates?
        id: select
        shell: bash
        run: |
          set -euo pipefail
          # A target that predates the Codex gate / M9 runner is NOT_APPLICABLE here: report that explicitly
          # instead of failing, and never call it validated. Applicable targets keep the exact checks below.
          ok=true
          f=tests/relay/test_acp_stdio_relay_transport.py
          for need in "${f}" tests/relay/test_codex_turn_gate.py tests/relay/test_m9_codex_first_live.py RUN_M9_CODEX_FIRST_LIVE.cmd src/relay/codex_turn_gate.cmd; do
            [[ -f "${need}" ]] || ok=false
          done
          if [[ "${ok}" == "true" ]]; then
            for c in TestOfficialCodexAdapterWithFixtureBackend TestCodexAdapterContract TestOfficialAdapterLaunchGuards; do
              grep -q "^class ${c}\b" "${f}" || ok=false
            done
          fi
          echo "applicable=${ok}" >> "${GITHUB_OUTPUT}"
          echo "applicable=${ok}"

      - name: Install official codex-acp 2.1.0 (no scripts, no optional native Codex)
        if: steps.select.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python --version
          node --version
          dir="$(cygpath -u "${RUNNER_TEMP}")/codex-acp-2.1.0"
          mkdir -p "${dir}"
          cd "${dir}"
          npm init -y >/dev/null
          npm install --ignore-scripts --omit=optional --no-audit --no-fund @agentclientprotocol/codex-acp@2.1.0
          [[ "$(node -p "require('./node_modules/@agentclientprotocol/codex-acp/package.json').version")" == "2.1.0" ]]
          [[ "$(ls node_modules/@openai)" == "codex" ]]
          [[ ! -e node_modules/@openai/codex/vendor ]]
          echo "RELAY_CODEX_ACP_DIR=$(cygpath -w "${dir}/node_modules/@agentclientprotocol/codex-acp")" >> "${GITHUB_ENV}"

      - name: Gate launcher + official codex-acp 2.1.0 contract on Windows (only the un-gated canary may skip)
        if: steps.select.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          PYTHONPATH=src python -m unittest -v \
            tests.relay.test_codex_turn_gate \
            tests.relay.test_acp_stdio_relay_transport.TestOfficialCodexAdapterWithFixtureBackend \
            tests.relay.test_acp_stdio_relay_transport.TestCodexAdapterContract \
            tests.relay.test_acp_stdio_relay_transport.TestOfficialAdapterLaunchGuards \
            tests.relay.test_m9_codex_first_live 2>&1 | tee windows.txt
          # Windows output has CRLF line ends: normalize before matching
          tr -d '\r' < windows.txt > windows-lf.txt
          grep -q '^OK (skipped=1)$' windows-lf.txt
          [[ "$(grep -c "skipped '" windows-lf.txt)" == "1" ]]
          grep -q "skipped 'un-gated canary needs an executable fixture" windows-lf.txt

      - name: Runner entry-point smoke (Windows .cmd must stop at preflight, never reach LIVE)
        if: steps.select.outputs.applicable == 'true'
        shell: bash
        run: |
          set +e
          cmd.exe //c RUN_M9_CODEX_FIRST_LIVE.cmd < /dev/null > smoke.txt 2>&1
          rc=$?
          set -e
          cat smoke.txt
          [[ "${rc}" == "2" ]]
          grep -q 'PREFLIGHT_' smoke.txt
          if grep -q 'APPROVE_FIRST_LIVE_POC' smoke.txt; then echo 'runner reached the approval prompt' >&2; exit 1; fi

      - name: Record
        shell: bash
        run: |
          {
            echo "## Relay codex-acp 2.1.0 Windows STATIC gate validation"
            echo "- target_sha: \`${{ needs.locate.outputs.target_sha }}\`"
            if [[ "${{ steps.select.outputs.applicable }}" != "true" ]]; then echo "- NOT_APPLICABLE: the target predates the Codex gate / M9 runner; nothing was validated"; fi
            echo "- chain: codex-acp 2.1.0 -> CODEX_PATH=codex_turn_gate.cmd -> codex_turn_gate.py -> fixture backend"
            echo "- live provider/model execution: NO"
          } >> "${GITHUB_STEP_SUMMARY}"
