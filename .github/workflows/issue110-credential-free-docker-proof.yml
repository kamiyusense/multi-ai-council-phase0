name: Issue 110 credential-free Docker component proof

on:
  push:
    branches:
      - proof/issue110-docker-component-001
    paths:
      - .github/workflows/issue110-credential-free-docker-proof.yml
      - automation/command_bus/tests/credential_free_docker_component_proof.sh
      - automation/command_bus/claude_gate_compose.yaml
      - automation/command_bus/docker/auth-control-plane/**
      - automation/command_bus/docker/claude-runtime/**

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run credential-free Docker component proof
        shell: bash
        run: |
          chmod +x automation/command_bus/tests/credential_free_docker_component_proof.sh
          automation/command_bus/tests/credential_free_docker_component_proof.sh
