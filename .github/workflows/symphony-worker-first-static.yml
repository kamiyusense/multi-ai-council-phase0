name: Symphony worker-first Local preflight STATIC

on:
  pull_request:
    paths:
      - automation/command_bus/scripts/symphony_worker_first_preflight.py
      - automation/command_bus/tests/test_symphony_worker_first_preflight.py
      - automation/command_bus/symphony_worker_first_preparation.py
      - automation/command_bus/tests/test_symphony_worker_first_preparation.py
      - automation/command_bus/symphony_native_binary_preparation.py
      - automation/command_bus/symphony_sqlite_preparation.py
      - automation/command_bus/scripts/symphony_installation_review.py
      - automation/command_bus/tests/test_symphony_native_binary_preparation.py
      - automation/command_bus/tests/test_symphony_sqlite_preparation.py
      - docs/SYMPHONY_CLOUD_INSTALLATION_HANDOVER.md
      - docs/evidence/symphony-worker-installation-cloud-20261014/**
      - docs/SYMPHONY_WORKER_FIRST_LOCAL_PREFLIGHT.md
      - .github/workflows/symphony-worker-first-static.yml

permissions:
  contents: read

concurrency:
  group: symphony-worker-first-static-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  worker-first-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR HEAD without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run dedicated read-only negative tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/worker-first-static"
          python -m unittest automation.command_bus.tests.test_symphony_native_binary_preparation automation.command_bus.tests.test_symphony_sqlite_preparation automation.command_bus.tests.test_symphony_g72_runtime automation.command_bus.tests.test_symphony_production_observer automation.command_bus.tests.test_symphony_worker_first_preflight automation.command_bus.tests.test_symphony_worker_first_preparation automation.command_bus.tests.test_symphony_sqlite_installation automation.command_bus.tests.test_symphony_g73_host automation.command_bus.tests.test_symphony_subscription_startup_patch -v 2>&1 | tee "$RUNNER_TEMP/worker-first-static/focused.txt"
      - name: Full command-bus regression
        run: |
          set -o pipefail
          python -m unittest discover -s automation/command_bus/tests -t . -v 2>&1 | tee "$RUNNER_TEMP/worker-first-static/full.txt"
      - name: Collect actual test totals from runner logs
        id: test_totals
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'worker-first-static'
          counts={}
          for label in ('focused','full'):
              text=(root/(label+'.txt')).read_text(encoding='utf-8')
              ran=re.findall(r'^Ran (\d+) tests in [0-9.]+s$',text,re.M)
              ok=re.findall(r'^OK(?: \(skipped=(\d+)\))?$',text,re.M)
              if len(ran)!=1 or len(ok)!=1:
                  raise SystemExit('actual successful test totals unavailable')
              counts[label]=int(ran[0])
              counts[label+'_skipped']=int(ok[0] or 0)
          (root/'test-totals.json').write_text(json.dumps(counts,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              for name,value in counts.items():
                  out.write(str(name)+'='+str(value)+'\n')
          PY
      - name: 'Record test totals: focused=${{ steps.test_totals.outputs.focused }}, full=${{ steps.test_totals.outputs.full }}, skipped=${{ steps.test_totals.outputs.full_skipped }}'
        run: test -s "$RUNNER_TEMP/worker-first-static/test-totals.json"
      - name: Verify original sealed evidence and unchanged production OFF gate
        run: |
          python -m automation.command_bus.scripts.validate_symphony_operator_static
          python - <<'PY'
          from pathlib import Path
          for name in ('authorize', 'candidate'):
              p=Path('.github/workflows/symphony-operator-'+name+'.yml')
              s=p.read_text()
              assert 'if: '+'$'+'{{ false }}' in s
              assert 'contents: read' in s
              assert 'id-token: write' not in s
              assert 'contents: write' not in s
          PY
      - name: Independent secret scan of every changed PR file
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCANNER_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          docker pull "$SCANNER_IMAGE"
          python - <<'PY'
          import os,shutil,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'worker-first-secret-scan'
          root.mkdir()
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=AM','-z',
              os.environ['BASE_SHA']+'...'+os.environ['HEAD_SHA']],text=True).split('\0')
          paths=[name for name in paths if name]
          if not paths:
              raise SystemExit('changed file inventory unavailable')
          for name in paths:
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(Path(name),target)
          (root/'trusted.toml').write_text('[extend]\nuseDefault = true\n')
          PY
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --pids-limit 64 --memory 128m --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount type=bind,src="$RUNNER_TEMP/worker-first-secret-scan",dst=/scan,readonly \
            "$SCANNER_IMAGE" dir /scan --config /scan/trusted.toml \
            --gitleaks-ignore-path /tmp/absent --ignore-gitleaks-allow --redact --no-banner \
            2>&1 | tee "$RUNNER_TEMP/worker-first-static/secret-scan.txt"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'worker-first-static'/'secret-scan.json'
          p.write_text(json.dumps({'result':'PASS','scope':'all added/modified PR files',
              'scanner_image':os.environ['SCANNER_IMAGE'],'network':'none',
              'candidate_allowlist':False,'real_model_starts':0},sort_keys=True)+'\n')
          PY
      - name: Compile, diff and immutable exact-head evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m compileall -q automation/command_bus
          git diff --check "$BASE_SHA...$HEAD_SHA"
          python - <<'PY'
          import json,os,pathlib,hashlib
          dst=pathlib.Path(os.environ['RUNNER_TEMP'])/'worker-first-static'
          data={'mode':'STATIC_READONLY','head':os.environ['HEAD_SHA'],
                'model_turns':0,'thread_starts':0,'github_publication':0,
                'production_off':True,'platform_rules':'NOT_EVALUATED',
                'test_totals':json.loads((dst/'test-totals.json').read_text()),
                'secret_scan':'PASS'}
          raw=(json.dumps(data,sort_keys=True)+'\n').encode()
          (dst/'receipt.json').write_bytes(raw)
          (dst/'receipt.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  receipt.json\n')
          PY
      - name: Upload static test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-first-static-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/worker-first-static/
          if-no-files-found: error
          retention-days: 30
