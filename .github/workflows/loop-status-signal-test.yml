permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run focused status and validation-scope tests present at exact PR head
        shell: bash
        run: |
          modules=(
            automation.command_bus.tests.test_claude_admission_gate
            automation.command_bus.tests.test_loop_status_issue
            automation.command_bus.tests.test_control_tower
            automation.command_bus.tests.test_control_tower_issue_plan
            automation.command_bus.tests.test_control_tower_verified_input
            automation.command_bus.tests.test_control_tower_issue_publisher
            automation.command_bus.tests.test_control_tower_registration
            automation.command_bus.tests.test_control_tower_live_preflight
            automation.command_bus.tests.test_control_tower_snapshot
            automation.command_bus.tests.test_control_tower_durable_collector
            automation.command_bus.tests.test_runtime_state_initializer
            automation.command_bus.tests.test_jules_semiauto_owner_prepare
            automation.command_bus.tests.test_jules_provider_readback_candidate
            automation.command_bus.tests.test_jules_provider_verification_source
            automation.command_bus.tests.test_jules_direct_readback_authenticator
            automation.command_bus.tests.test_semiauto_identity_bootstrap
            automation.command_bus.tests.test_semiauto_bootstrap_persistence
            automation.command_bus.tests.test_semiauto_runtime_identity
            automation.command_bus.tests.test_semiauto_stable_identity_static_e2e
            automation.command_bus.tests.test_github_oidc_claims_policy
            automation.command_bus.tests.test_github_oidc_proof_policy_cli
            automation.command_bus.tests.test_github_oidc_workflow_evidence_link
            automation.command_bus.tests.test_claude_loop
            automation.command_bus.tests.test_loop_status_development
            automation.command_bus.tests.test_loop_owner
            automation.command_bus.tests.test_loop_owner_backend
            automation.command_bus.tests.test_loop_owner_observation
            automation.command_bus.tests.test_loop_owner_authority
            automation.command_bus.tests.test_loop_status_transition
            automation.command_bus.tests.test_loop_status_transition_cli
            automation.command_bus.tests.test_loop_status_evidence
            automation.command_bus.tests.test_runtime_transition_publisher
            automation.command_bus.tests.test_runtime_transition_fail_closed
            automation.command_bus.tests.test_runtime_transition_close
            automation.command_bus.tests.test_runtime_transition_jules
            automation.command_bus.tests.test_runtime_transition_receipt_status
            automation.command_bus.tests.test_runtime_transition_status_dispatch
            automation.command_bus.tests.test_runtime_takeover
            automation.command_bus.tests.test_runtime_takeover_prepare
            automation.command_bus.tests.test_runtime_takeover_static_e2e
            automation.command_bus.tests.test_runtime_transition_owner_authority
            automation.command_bus.tests.test_validation_scope
          )
          existing=()
          for module in "${modules[@]}"; do
            path="${module//./\/}.py"
            if [[ -f "$path" ]]; then
              existing+=("$module")
            else
              echo "::notice::focused test absent at checked-out PR head: $module"
            fi
          done
          test "${#existing[@]}" -gt 0
          python -m unittest "${existing[@]}" -v

      - name: Run full command-bus suite
        shell: bash
        run: |
          python -m unittest discover -v automation/command_bus/tests

      - name: Verify OAuth proxy and launcher without network access
        shell: bash
        run: |
          node --check automation/command_bus/docker/auth-control-plane/auth_control_plane_proxy.mjs
          node --check automation/command_bus/docker/claude-runtime/claude_runtime_launcher.mjs
          node --test automation/command_bus/tests/test_claude_auth_control_proxy.mjs
          node --check automation/command_bus/github_oidc_signature_proof.mjs
          node --test automation/command_bus/tests/test_github_oidc_signature_proof.mjs
          python -m compileall -q automation/command_bus

      - name: Parse command-bus JSON schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("automation/command_bus/claude_gate_compose.yaml").read_text(encoding="utf-8"))
          for path in sorted(Path("automation/command_bus/schema").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"schema-ok {path}")
          PY

      - name: Compile command-bus Python
        shell: bash
        run: python -m compileall -q automation/command_bus

      - name: Diff check
        shell: bash
        run: git diff --check
