name: Phase 0 Jules session readback

on:
  push:
    branches:
      - feature/chat-work-command-bus
    paths:
      - automation/command_bus/jules_api_status_requests/*.json

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Locate one newly-added status request
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          commit_json="$(curl --fail-with-body --retry 0 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/${COMMIT_SHA}")"
          total="$(jq '.files | length' <<<"${commit_json}")"
          [[ "${total}" == "1" ]] || { echo "Expected one status file." >&2; exit 1; }
          status="$(jq -r '.files[0].status' <<<"${commit_json}")"
          path="$(jq -r '.files[0].filename' <<<"${commit_json}")"
          [[ "${status}" == "added" ]] || { echo "Status request must be append-only." >&2; exit 1; }
          [[ "${path}" =~ ^automation/command_bus/jules_api_status_requests/[a-z0-9][a-z0-9._-]{0,63}\.json$ ]] || { echo "Unexpected status path." >&2; exit 1; }
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Read Jules session once
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          STATUS_PATH: ${{ steps.locate.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          session_id="$(jq -er '.session_id' "${STATUS_PATH}")"
          [[ "${session_id}" =~ ^[0-9]+$ ]] || { echo "Invalid session_id." >&2; exit 1; }
          include_activities="$(jq -er 'if has("include_activities") then (.include_activities | if type == "boolean" then tostring else error("include_activities must be boolean") end) else "true" end' "${STATUS_PATH}")"

          response_file="${RUNNER_TEMP}/jules-session.json"
          http_code="$(curl --silent --show-error --fail-with-body --retry 0 \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
            "https://jules.googleapis.com/v1alpha/sessions/${session_id}")"
          [[ "${http_code}" =~ ^2[0-9][0-9]$ ]] || { echo "Unexpected Jules HTTP status ${http_code}." >&2; exit 1; }

          name="$(jq -r '.name // "UNKNOWN"' "${response_file}")"
          state="$(jq -r '.state // "UNKNOWN"' "${response_file}")"
          pr_url="$(jq -r '[.outputs[]? | .pullRequest?.url // empty] | first // ""' "${response_file}")"
          timing_json="$(python -m automation.command_bus.jules_session_acceptance \
            "${response_file}" --expected-session-id "${session_id}")"
          session_create_time="$(jq -er '.session_create_time' <<<"${timing_json}")"
          accepted_at_jst="$(jq -er '.accepted_at_jst' <<<"${timing_json}")"
          update_time="$(jq -r '.updateTime // ""' "${response_file}")"
          provider_source="$(jq -r '.sourceContext.source // ""' "${response_file}")"
          starting_branch="$(jq -r '.sourceContext.githubRepoContext.startingBranch // ""' "${response_file}")"
          evidence_file="${RUNNER_TEMP}/jules-session-readback-evidence.json"
          jq -n \
            --arg session_id "${session_id}" \
            --arg name "${name}" \
            --arg state "${state}" \
            --arg create_time "${session_create_time}" \
            --arg update_time "${update_time}" \
            --arg provider_source "${provider_source}" \
            --arg starting_branch "${starting_branch}" \
            --arg include_activities "${include_activities}" \
            '{
              schema_version: 1,
              proof_kind: "JULES_SESSION_READBACK_SANITIZED",
              session_id: $session_id,
              name: $name,
              state: $state,
              create_time: $create_time,
              update_time: (if $update_time == "" then null else $update_time end),
              provider_source: (if $provider_source == "" then null else $provider_source end),
              starting_branch: (if $starting_branch == "" then null else $starting_branch end),
              include_activities: ($include_activities == "true"),
              retry: 0,
              fallback: "disabled"
            }' > "${evidence_file}"
          echo "Jules session readback: name=${name} state=${state} accepted_at_jst=${accepted_at_jst} pr_url=${pr_url:-NONE}"

          if [[ "${include_activities}" == "true" ]]; then
            activities_file="${RUNNER_TEMP}/jules-activities.json"
            activities_code="$(curl --silent --show-error --fail-with-body --retry 0 \
              --output "${activities_file}" \
              --write-out '%{http_code}' \
              -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
              "https://jules.googleapis.com/v1alpha/sessions/${session_id}/activities?pageSize=100")"
            [[ "${activities_code}" =~ ^2[0-9][0-9]$ ]] || { echo "Unexpected Jules activities HTTP status ${activities_code}." >&2; exit 1; }

            latest_agent_activity="$(jq -c '[.activities[]? | select(.originator == "agent" and .agentMessaged.agentMessage != null)] | last // empty' "${activities_file}")"

            if [[ -z "${latest_agent_activity}" ]]; then
              latest_agent_message_json="NONE"
              latest_agent_activity_name="UNKNOWN"
            else
              latest_agent_message_json="$(jq -c '.agentMessaged.agentMessage' <<<"${latest_agent_activity}")"
              latest_agent_activity_name="$(jq -r '.name // "UNKNOWN"' <<<"${latest_agent_activity}")"

              prefix="sessions/${session_id}/activities/"
              if [[ "${latest_agent_activity_name}" == "${prefix}"* ]]; then
                activity_id="${latest_agent_activity_name#${prefix}}"
                if [[ ! "${activity_id}" =~ ^[A-Za-z0-9._-]+$ ]] || [[ "${activity_id}" == "." ]] || [[ "${activity_id}" == ".." ]]; then
                  latest_agent_activity_name="UNKNOWN"
                fi
              else
                latest_agent_activity_name="UNKNOWN"
              fi
            fi
          else
            latest_agent_message_json="SKIPPED"
            latest_agent_activity_name="SKIPPED"
          fi

          echo "Jules latest agent message JSON: ${latest_agent_message_json}"

          {
            printf '## Jules session readback\n'
            printf -- '- session_id: `%s`\n' "${session_id}"
            printf -- '- state: `%s`\n' "${state}"
            printf -- '- jules_session_create_time: `%s`\n' "${session_create_time}"
            printf -- '- accepted_at_jst: `%s`\n' "${accepted_at_jst}"
            printf -- '- accepted_at_source: `%s`\n' "JULES_SESSION_GET_CREATE_TIME_READBACK"
            printf -- '- pull_request: `%s`\n' "${pr_url:-NONE}"
            printf -- '- activities_readback: `%s`\n' "${include_activities}"
            printf -- '- latest_agent_activity_name: `%s`\n' "${latest_agent_activity_name}"
            printf -- '- latest_agent_message_json: `%s`\n' "${latest_agent_message_json}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save sanitized Jules session readback evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jules-session-readback-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/jules-session-readback-evidence.json
          if-no-files-found: error
          retention-days: 30
