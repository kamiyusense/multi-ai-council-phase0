name: Phase 0 Jules session readback

on:
  push:
    branches:
      - feature/chat-work-command-bus
    paths:
      - automation/command_bus/jules_api_status_requests/*.json

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Locate one newly-added status request
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          commit_json="$(curl --fail-with-body --retry 0 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/${COMMIT_SHA}")"
          total="$(jq '.files | length' <<<"${commit_json}")"
          [[ "${total}" == "1" ]] || { echo "Expected one status file." >&2; exit 1; }
          status="$(jq -r '.files[0].status' <<<"${commit_json}")"
          path="$(jq -r '.files[0].filename' <<<"${commit_json}")"
          [[ "${status}" == "added" ]] || { echo "Status request must be append-only." >&2; exit 1; }
          [[ "${path}" =~ ^automation/command_bus/jules_api_status_requests/[a-z0-9][a-z0-9._-]{0,63}\.json$ ]] || { echo "Unexpected status path." >&2; exit 1; }
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Read Jules session once
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          STATUS_PATH: ${{ steps.locate.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          session_id="$(jq -er '.session_id' "${STATUS_PATH}")"
          [[ "${session_id}" =~ ^[0-9]+$ ]] || { echo "Invalid session_id." >&2; exit 1; }
          response_file="${RUNNER_TEMP}/jules-session.json"
          http_code="$(curl --silent --show-error --fail-with-body --retry 0 \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
            "https://jules.googleapis.com/v1alpha/sessions/${session_id}")"
          [[ "${http_code}" =~ ^2[0-9][0-9]$ ]] || { echo "Unexpected Jules HTTP status ${http_code}." >&2; exit 1; }
          name="$(jq -r '.name // "UNKNOWN"' "${response_file}")"
          state="$(jq -r '.state // "UNKNOWN"' "${response_file}")"
          pr_url="$(jq -r '[.outputs[]? | .pullRequest?.url // empty] | first // ""' "${response_file}")"
          timing_json="$(python -m automation.command_bus.jules_session_acceptance             "${response_file}" --expected-session-id "${session_id}")"
          session_create_time="$(jq -er '.session_create_time' <<<"${timing_json}")"
          accepted_at_jst="$(jq -er '.accepted_at_jst' <<<"${timing_json}")"
          echo "Jules session readback: name=${name} state=${state} accepted_at_jst=${accepted_at_jst} pr_url=${pr_url:-NONE}"
          {
            echo "## Jules session readback"
            echo "- session_id: \`${session_id}\`"
            echo "- state: \`${state}\`"
            echo "- jules_session_create_time: \`${session_create_time}\`"
            echo "- accepted_at_jst: \`${accepted_at_jst}\`"
            echo "- accepted_at_source: \`JULES_SESSION_GET_CREATE_TIME_READBACK\`"
            echo "- pull_request: \`${pr_url:-NONE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
