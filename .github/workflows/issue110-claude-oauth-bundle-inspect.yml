name: Issue 110 Claude 2.1.283 OAuth bundle static inspection

on:
  push:
    branches:
      - prepare/issue110-oauth-fixture-refresh-v1
    paths:
      - .github/workflows/issue110-claude-oauth-bundle-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact inspection head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build exact pinned Claude runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker build             -t phase0-claude-runtime:2.1.283             -f automation/command_bus/docker/claude-runtime/Dockerfile             automation/command_bus

      - name: Inspect OAuth implementation markers with runtime network disabled
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none             --entrypoint sh             phase0-claude-runtime:2.1.283             -c '
              ROOT=/usr/local/lib/node_modules/@anthropic-ai/claude-code
              test -d "$ROOT"
              echo "CLAUDE_VERSION=$(claude --version)"
              for marker in                 "/v1/oauth/token"                 ".oauth_refresh.lock"                 "init_after_oauth_populate"                 "waitForHeldOAuthRefresh"                 "checkAndRefreshOAuthTokenIfNeeded"; do
                count=$(grep -R -F -o "$marker" "$ROOT" 2>/dev/null | wc -l | tr -d " ")
                echo "MARKER[$marker]=$count"
              done
              echo "CLAUDE_OAUTH_BUNDLE_STATIC_INSPECTION_PASS"
            '
