name: Issue 110 OAuth refresh generation commit IO proof

on:
  push:
    branches:
      - prepare/issue110-oauth-refresh-generation-commit-io-v1
    paths:
      - .github/workflows/issue110-oauth-refresh-generation-commit-io.yml
      - automation/command_bus/claude_oauth_refresh_generation.mjs
      - automation/command_bus/claude_oauth_refresh_generation_state.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_generation_state.mjs

permissions:
  contents: read

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit-IO head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run generation state IO tests
        shell: bash
        run: node --test automation/command_bus/tests/test_claude_oauth_refresh_generation_state.mjs

      - name: Verify no network implementation and diff
        shell: bash
        run: |
          node --check automation/command_bus/claude_oauth_refresh_generation_state.mjs
          node --check automation/command_bus/tests/test_claude_oauth_refresh_generation_state.mjs
          python - <<'PY'
          from pathlib import Path
          text=Path("automation/command_bus/claude_oauth_refresh_generation_state.mjs").read_text()
          for marker in ("node:net","node:tls","node:http","node:https","fetch("):
              assert marker not in text, marker
          print("OAUTH_REFRESH_GENERATION_COMMIT_IO_NO_NETWORK_PASS")
          PY
          git diff --check
