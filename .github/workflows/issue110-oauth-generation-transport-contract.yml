name: Issue 110 OAuth generation transport contract proof

on:
  push:
    branches:
      - test/issue110-oauth-generation-transport-contract-v1
    paths:
      - .github/workflows/issue110-oauth-generation-transport-contract.yml
      - automation/command_bus/tests/test_claude_oauth_generation_transport_contract.mjs
      - automation/command_bus/claude_oauth_refresh_generation_prepare.mjs
      - automation/command_bus/claude_oauth_refresh_generation_state.mjs
      - automation/command_bus/claude_oauth_refresh_transport.mjs
      - automation/command_bus/claude_oauth_refresh_helper.mjs

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact contract head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run generation/transport contract test
        shell: bash
        run: node --test automation/command_bus/tests/test_claude_oauth_generation_transport_contract.mjs

      - name: Verify test never opens local transport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("automation/command_bus/tests/test_claude_oauth_generation_transport_contract.mjs").read_text()
          assert "createLocalTlsFixtureRefreshTransport" not in text
          assert "net.connect" not in text
          assert "tls.connect" not in text
          print("OAUTH_GENERATION_TRANSPORT_CONTRACT_NO_NETWORK_PASS")
          PY
          node --check automation/command_bus/tests/test_claude_oauth_generation_transport_contract.mjs
          git diff --check
