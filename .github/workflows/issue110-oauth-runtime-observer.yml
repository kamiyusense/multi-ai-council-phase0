name: Issue 110 read-only OAuth runtime observer candidate

on:
  push:
    branches:
      - observe/issue110-oauth-readonly-runtime-preflight-v1
    paths:
      - .github/workflows/issue110-oauth-runtime-observer.yml
      - automation/command_bus/claude_oauth_refresh_runtime_observer.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_runtime_observer.mjs
      - automation/command_bus/claude_oauth_refresh_mock_preflight.mjs
  pull_request:
    branches:
      - mock/issue110-oauth-helper-exclusive-preflight-v1
    paths:
      - .github/workflows/issue110-oauth-runtime-observer.yml
      - automation/command_bus/claude_oauth_refresh_runtime_observer.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_runtime_observer.mjs
      - automation/command_bus/claude_oauth_refresh_mock_preflight.mjs

permissions:
  contents: read

jobs:
  runtime-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact observer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run observer tests with injected fake runner only
        shell: bash
        run: >-
          node --test
          automation/command_bus/tests/test_claude_oauth_refresh_runtime_observer.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_mock_preflight.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_topology_contract.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_production_adapter.mjs
          automation/command_bus/tests/test_claude_oauth_generation_transport_contract.mjs
          automation/command_bus/tests/test_claude_oauth_generation_production_adapter_integration.mjs

      - name: Verify read-only command contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("automation/command_bus/claude_oauth_refresh_runtime_observer.mjs").read_text()
          assert '"ps"' in source
          assert '"--all"' in source
          assert '"--no-trunc"' in source
          assert 'shell: false' in source
          assert '"inspect"' not in source
          for command in ('"start"', '"stop"', '"exec"', '"restart"', '"run"', '"build"', '"pull"'):
              assert command not in source
          assert '.Config.Env' not in source
          assert '.Mounts' not in source
          print("OAUTH_RUNTIME_OBSERVER_STATIC_READONLY_CONTRACT_PASS")
          PY
          node --check automation/command_bus/claude_oauth_refresh_runtime_observer.mjs
          node --check automation/command_bus/tests/test_claude_oauth_refresh_runtime_observer.mjs
          git diff --check
