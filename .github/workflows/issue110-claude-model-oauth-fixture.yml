name: Issue 110 Claude 2.1.283 model-turn OAuth fixture after Gate routing fix

on:
  push:
    branches:
      - prepare/issue110-oauth-model-after-routing-v1
    paths:
      - .github/workflows/issue110-claude-model-oauth-fixture.yml
      - automation/command_bus/tests/claude_model_turn_oauth_fixture.sh
      - automation/command_bus/tests/fixtures/claude_model_auth_mock.mjs
      - automation/command_bus/tests/fixtures/claude_oauth_refresh_mock_proxy.mjs
      - automation/command_bus/docker/claude-runtime/Dockerfile

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        delay_ms: [0, 500]
    name: fixture-delay-${{ matrix.delay_ms }}ms
    steps:
      - name: Checkout exact fixture head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run isolated model-turn OAuth fixture
        shell: bash
        env:
          MOCK_DELAY_MS: ${{ matrix.delay_ms }}
        run: |
          chmod +x automation/command_bus/tests/claude_model_turn_oauth_fixture.sh
          automation/command_bus/tests/claude_model_turn_oauth_fixture.sh
