name: V4 read-only board

# docs/RELAY_TOWER_DIRECTION_V4.md steps S4b/S5. Applies the owner's comments on the board Issue to the board
# record (its own branch, automation/command_bus/config/v4_board.json), then regenerates the board's managed block
# from the lane catalog, the record and the #346 loop checkpoints. No provider or model, no retry of a write.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-board
  cancel-in-progress: false

jobs:
  regenerate-board:
    if: github.repository == 'kamiyusense/multi-ai-council-phase0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # contents: write is only for the board record file on its own branch (step S5).
      contents: write
      issues: write
    steps:
      - name: Checkout trusted renderer from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Regenerate board
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m automation.command_bus.v4_board_cli
