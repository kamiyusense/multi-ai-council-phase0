name: Phase 0 Jules session message

on:
  push:
    branches:
      - feature/chat-work-command-bus
      - claude/jules-api-carrier
    paths:
      - automation/command_bus/jules_api_message_requests/*.json

permissions:
  contents: read

jobs:
  send-message:
    runs-on: ubuntu-latest
    environment: jules-api
    timeout-minutes: 5
    steps:
      - name: Checkout exact carrier commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Locate one newly-added message request
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          commit_json="$(curl --fail-with-body --retry 0 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/${COMMIT_SHA}")"
          total="$(jq '.files | length' <<<"${commit_json}")"
          [[ "${total}" == "1" ]] || { echo "Expected one message request file." >&2; exit 1; }
          status="$(jq -r '.files[0].status' <<<"${commit_json}")"
          path="$(jq -r '.files[0].filename' <<<"${commit_json}")"
          [[ "${status}" == "added" ]] || { echo "Message request must be append-only." >&2; exit 1; }
          [[ "${path}" =~ ^automation/command_bus/jules_api_message_requests/[a-z0-9][a-z0-9._-]{0,63}\.json$ ]] || { echo "Unexpected message request path." >&2; exit 1; }
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Validate request and send exactly once
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          MESSAGE_PATH: ${{ steps.locate.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          session_id="$(jq -er '.session_id' "${MESSAGE_PATH}")"
          expected_state="$(jq -er '.expected_state' "${MESSAGE_PATH}")"
          prompt="$(jq -er '.prompt' "${MESSAGE_PATH}")"

          [[ "${session_id}" =~ ^[0-9]+$ ]] || { echo "Invalid session_id." >&2; exit 1; }
          [[ "${expected_state}" == "AWAITING_USER_FEEDBACK" || "${expected_state}" == "COMPLETED" ]] || { echo "Unsupported expected_state." >&2; exit 1; }
          [[ -n "${prompt}" ]] || { echo "Prompt must be non-empty." >&2; exit 1; }
          [[ "${#prompt}" -le 4000 ]] || { echo "Prompt too long." >&2; exit 1; }

          session_file="${RUNNER_TEMP}/jules-session.json"
          http_code="$(curl --silent --show-error --fail-with-body --retry 0 \
            --output "${session_file}" \
            --write-out '%{http_code}' \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
            "https://jules.googleapis.com/v1alpha/sessions/${session_id}")"
          [[ "${http_code}" =~ ^2[0-9][0-9]$ ]] || { echo "Unexpected Jules session HTTP status ${http_code}." >&2; exit 1; }

          current_state="$(jq -r '.state // "UNKNOWN"' "${session_file}")"
          [[ "${current_state}" == "${expected_state}" ]] || { echo "Jules session state changed; refusing stale send. current=${current_state}" >&2; exit 1; }

          body_file="${RUNNER_TEMP}/jules-message.json"
          jq -n --arg prompt "${prompt}" '{prompt: $prompt}' > "${body_file}"
          prompt_sha256="$(printf '%s' "${prompt}" | sha256sum | awk '{print $1}')"

          response_file="${RUNNER_TEMP}/jules-message-response.json"
          send_code="$(curl --silent --show-error --fail-with-body --retry 0 \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
            --data-binary "@${body_file}" \
            "https://jules.googleapis.com/v1alpha/sessions/${session_id}:sendMessage")"
          [[ "${send_code}" =~ ^2[0-9][0-9]$ ]] || { echo "Unexpected Jules sendMessage HTTP status ${send_code}." >&2; exit 1; }

          echo "Jules message accepted: session_id=${session_id} prompt_sha256=${prompt_sha256}"
          {
            echo "## Jules session message"
            echo "- session_id: `${session_id}`"
            echo "- pre_send_state: `${current_state}`"
            echo "- prompt_sha256: `${prompt_sha256}`"
            echo "- retry: `0`"
          } >> "${GITHUB_STEP_SUMMARY}"
