name: "Relay Loop 062 Isolated Verification"

on:
  push:
    branches:
      - "verify/relay-loop-062-abort-readback-6884c332"

permissions:
  contents: read

concurrency:
  group: relay-loop-062-isolated-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact verification commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Run Loop 062 focused unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.relay.test_abort_readback_proof_contract -v

      - name: Run Relay regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
