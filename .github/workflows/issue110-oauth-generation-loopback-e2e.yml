name: Issue 110 OAuth generation loopback TLS end-to-end proof

on:
  push:
    branches:
      - test/issue110-oauth-generation-loopback-e2e-v1
    paths:
      - .github/workflows/issue110-oauth-generation-loopback-e2e.yml
      - automation/command_bus/tests/test_claude_oauth_generation_loopback_e2e.mjs
      - automation/command_bus/claude_oauth_refresh_generation_prepare.mjs
      - automation/command_bus/claude_oauth_refresh_generation_state.mjs
      - automation/command_bus/claude_oauth_refresh_transport.mjs
      - automation/command_bus/claude_oauth_refresh_helper.mjs

permissions:
  contents: read

jobs:
  loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact loopback-e2e head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run generation loopback TLS end-to-end test
        shell: bash
        run: node --test automation/command_bus/tests/test_claude_oauth_generation_loopback_e2e.mjs

      - name: Verify loopback-only test construction
        shell: bash
        run: |
          node --check automation/command_bus/tests/test_claude_oauth_generation_loopback_e2e.mjs
          python - <<'PY'
          from pathlib import Path
          text=Path("automation/command_bus/tests/test_claude_oauth_generation_loopback_e2e.mjs").read_text()
          assert "createLocalTlsFixtureRefreshTransport" in text
          assert "FIXTURE_PROXY_HOST" in text
          assert "net.connect(" in text
          assert "{ host: FIXTURE_PROXY_HOST, port: originPort }" in text
          assert "api.anthropic.com" not in text
          print("OAUTH_GENERATION_LOOPBACK_ONLY_PASS")
          PY
          git diff --check
