name: Issue 110 OAuth helper mock exclusivity preflight

on:
  push:
    branches:
      - mock/issue110-oauth-helper-exclusive-preflight-v1
    paths:
      - .github/workflows/issue110-oauth-helper-mock-preflight.yml
      - automation/command_bus/claude_oauth_refresh_mock_preflight.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_mock_preflight.mjs
  pull_request:
    branches:
      - static/issue110-oauth-generation-adapter-topology-v1
    paths:
      - .github/workflows/issue110-oauth-helper-mock-preflight.yml
      - automation/command_bus/claude_oauth_refresh_mock_preflight.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_mock_preflight.mjs

permissions:
  contents: read

jobs:
  mock-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact mock preflight head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run pure mock preflight and topology tests
        shell: bash
        run: >-
          node --test
          automation/command_bus/tests/test_claude_oauth_refresh_mock_preflight.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_topology_contract.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_production_adapter.mjs
          automation/command_bus/tests/test_claude_oauth_generation_transport_contract.mjs
          automation/command_bus/tests/test_claude_oauth_generation_production_adapter_integration.mjs

      - name: Verify read-only workflow and source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/issue110-oauth-helper-mock-preflight.yml").read_text().splitlines()
          actions = [line.strip() for line in workflow if line.strip().startswith("uses:")]
          assert actions == ["uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262"]
          source = Path("automation/command_bus/claude_oauth_refresh_mock_preflight.mjs").read_text()
          assert "MOCK_ONLY" in source
          assert "may_start_helper: false" in source
          print("OAUTH_REFRESH_MOCK_PREFLIGHT_NO_RUNTIME_ACCESS_PASS")
          PY
          node --check automation/command_bus/claude_oauth_refresh_mock_preflight.mjs
          node --check automation/command_bus/tests/test_claude_oauth_refresh_mock_preflight.mjs
          git diff --check
