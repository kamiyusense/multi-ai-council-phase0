name: Phase 0 development lane status

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - automation/command_bus/loop_status_development.py
      - automation/command_bus/loop_status_issue.py
      - .github/workflows/loop-status-development.yml
      - docs/LOOP_STATUS_SIGNAL.md
  pull_request_target:
    # Only PRs based on main can pass the job `if:` below (PR #4 / #25 are main-based);
    # the filter stops stacked Jules/lane PRs from queuing a run that is always skipped.
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: phase0-loop-status-signal
  queue: max

jobs:
  refresh-development:
    if: >-
      github.repository == 'kamiyusense/multi-ai-council-phase0' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        github.event.pull_request.number == 4 ||
        github.event.pull_request.number == 25
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted renderer from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Fetch Issue and development PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STATUS_ISSUE: "33"
        shell: bash
        run: |
          set -euo pipefail

          api_get() {
            local path="$1"
            local out="$2"
            curl --silent --show-error --fail-with-body --retry 0 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/${path}" > "${out}"
          }

          api_get "issues/${STATUS_ISSUE}" "${RUNNER_TEMP}/issue-base.json"
          api_get "pulls/4" "${RUNNER_TEMP}/relay-pr.json"
          api_get "pulls/25" "${RUNNER_TEMP}/claude-pr.json"
          api_get "branches/main" "${RUNNER_TEMP}/main-branch.json"

          jq -j '.body // ""' "${RUNNER_TEMP}/issue-base.json" > "${RUNNER_TEMP}/issue-base-body.md"

          jq -n \
            --slurpfile relay "${RUNNER_TEMP}/relay-pr.json" \
            --slurpfile claude "${RUNNER_TEMP}/claude-pr.json" \
            --slurpfile main "${RUNNER_TEMP}/main-branch.json" \
            '{
              main_sha: $main[0].commit.sha,
              lanes: [
                {
                  pr: 4,
                  state: $relay[0].state,
                  merged: $relay[0].merged,
                  mergeable: $relay[0].mergeable,
                  draft: $relay[0].draft,
                  head_sha: $relay[0].head.sha,
                  commits: $relay[0].commits,
                  updated_at: $relay[0].updated_at
                },
                {
                  pr: 25,
                  state: $claude[0].state,
                  merged: $claude[0].merged,
                  mergeable: $claude[0].mergeable,
                  draft: $claude[0].draft,
                  head_sha: $claude[0].head.sha,
                  commits: $claude[0].commits,
                  updated_at: $claude[0].updated_at
                }
              ]
            }' > "${RUNNER_TEMP}/development-snapshot.json"

      - name: Render development section
        shell: bash
        run: |
          set -euo pipefail
          python -m automation.command_bus.loop_status_development \
            "${RUNNER_TEMP}/issue-base-body.md" \
            "${RUNNER_TEMP}/development-snapshot.json" \
            --body-out "${RUNNER_TEMP}/status-body.md"

      - name: Update display Issue only when changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STATUS_ISSUE: "33"
        shell: bash
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body --retry 0 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${STATUS_ISSUE}" \
            > "${RUNNER_TEMP}/issue-before.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          base = Path(os.environ["RUNNER_TEMP"], "issue-base-body.md").read_text(encoding="utf-8")
          actual = json.loads(Path(os.environ["RUNNER_TEMP"], "issue-before.json").read_text(encoding="utf-8"))["body"]
          if actual != base:
              raise SystemExit("status Issue changed after development readback; refusing overwrite")
          PY

          if python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = Path(os.environ["RUNNER_TEMP"], "status-body.md").read_text(encoding="utf-8")
          actual = json.loads(Path(os.environ["RUNNER_TEMP"], "issue-before.json").read_text(encoding="utf-8"))["body"]
          raise SystemExit(0 if actual == expected else 1)
          PY
          then
            echo "Development section already matches; NO-OP."
          else
            jq -Rs '{body: .}' "${RUNNER_TEMP}/status-body.md" > "${RUNNER_TEMP}/issue-patch.json"
            curl --silent --show-error --fail-with-body --retry 0 \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"${RUNNER_TEMP}/issue-patch.json" \
              "https://api.github.com/repos/${REPOSITORY}/issues/${STATUS_ISSUE}" \
              > "${RUNNER_TEMP}/issue-write.json"
          fi

          curl --silent --show-error --fail-with-body --retry 0 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${STATUS_ISSUE}" \
            > "${RUNNER_TEMP}/issue-readback.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = Path(os.environ["RUNNER_TEMP"], "status-body.md").read_text(encoding="utf-8")
          actual = json.loads(Path(os.environ["RUNNER_TEMP"], "issue-readback.json").read_text(encoding="utf-8"))["body"]
          if actual != expected:
              raise SystemExit("development status Issue readback mismatch")
          PY

      - name: Record development projection
        if: always()
        shell: bash
        run: |
          {
            echo "## Phase 0 Development Status"
            echo "- Issue: #33"
            echo "- source: GitHub PR #4 / PR #25 / main readback"
            echo "- comments/@mentions: none"
            echo "- provider/model dispatch: none"
            echo "- retry: `0`"
            echo "- fallback: `disabled`"
          } >> "${GITHUB_STEP_SUMMARY}"
