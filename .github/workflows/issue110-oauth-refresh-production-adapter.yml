name: Issue 110 OAuth refresh production adapter static proof

on:
  push:
    branches:
      - prepare/issue110-oauth-refresh-production-adapter-v1
    paths:
      - .github/workflows/issue110-oauth-refresh-production-adapter.yml
      - automation/command_bus/claude_oauth_refresh_helper.mjs
      - automation/command_bus/claude_oauth_refresh_production_plan.mjs
      - automation/command_bus/claude_oauth_refresh_production_adapter.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_production_plan.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_production_adapter.mjs

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact adapter head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run production plan and adapter tests
        shell: bash
        run: |
          node --test \
            automation/command_bus/tests/test_claude_oauth_refresh_production_plan.mjs \
            automation/command_bus/tests/test_claude_oauth_refresh_production_adapter.mjs

      - name: Verify helper CLI remains production-unwired
        shell: bash
        run: |
          set +e
          node automation/command_bus/claude_oauth_refresh_helper.mjs run             >/tmp/helper-run.out 2>/tmp/helper-run.err
          code=$?
          set -e
          test "$code" = "78"
          grep -F "production OAuth transport is not wired" /tmp/helper-run.err
          grep -F "no network request was attempted" /tmp/helper-run.err
          echo "OAUTH_REFRESH_PRODUCTION_ADAPTER_HELPER_UNWIRED_PASS"

      - name: Verify adapter has no native network constructor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("automation/command_bus/claude_oauth_refresh_production_adapter.mjs").read_text()
          for marker in (
              'from "node:net"',
              "from 'node:net'",
              'from "node:tls"',
              "from 'node:tls'",
              'from "node:http"',
              "from 'node:http'",
              'from "node:https"',
              "from 'node:https'",
              "process.env",
          ):
              assert marker not in text, marker
          print("OAUTH_REFRESH_PRODUCTION_ADAPTER_NO_NATIVE_NETWORK_PASS")
          PY

      - name: Syntax and diff checks
        shell: bash
        run: |
          node --check automation/command_bus/claude_oauth_refresh_production_adapter.mjs
          node --check automation/command_bus/tests/test_claude_oauth_refresh_production_adapter.mjs
          git diff --check
