name: Issue 110 OAuth one-shot credential boundary STATIC contract

on:
  push:
    branches:
      - static/issue110-oauth-one-shot-credential-boundary-v1
    paths:
      - .github/workflows/issue110-oauth-one-shot-credential-boundary.yml
      - automation/command_bus/claude_oauth_refresh_one_shot_boundary.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_one_shot_boundary.mjs
      - automation/command_bus/claude_gate_compose.yaml
      - automation/command_bus/claude_oauth_refresh_helper.mjs
      - automation/command_bus/claude_oauth_refresh_production_adapter.mjs
      - automation/command_bus/docker/oauth-refresh-helper/Dockerfile
  pull_request:
    branches:
      - static/issue110-oauth-helper-compose-candidate-v1
    paths:
      - .github/workflows/issue110-oauth-one-shot-credential-boundary.yml
      - automation/command_bus/claude_oauth_refresh_one_shot_boundary.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_one_shot_boundary.mjs
      - automation/command_bus/claude_gate_compose.yaml
      - automation/command_bus/claude_oauth_refresh_helper.mjs
      - automation/command_bus/claude_oauth_refresh_production_adapter.mjs
      - automation/command_bus/docker/oauth-refresh-helper/Dockerfile

permissions:
  contents: read

jobs:
  static-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact one-shot candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run PR 155-164 regressions and new STATIC/MOCK tests
        shell: bash
        run: >-
          node --test
          automation/command_bus/tests/test_claude_oauth_refresh_one_shot_boundary.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_compose_candidate.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_helper.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_topology_contract.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_mock_preflight.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_runtime_observer.mjs
          automation/command_bus/tests/test_claude_oauth_refresh_production_adapter.mjs
          automation/command_bus/tests/test_claude_oauth_generation_transport_contract.mjs
          automation/command_bus/tests/test_claude_oauth_generation_production_adapter_integration.mjs

      - name: Verify no production Compose or execution wiring
        shell: bash
        run: |
          node --check automation/command_bus/claude_oauth_refresh_one_shot_boundary.mjs
          node --check automation/command_bus/tests/test_claude_oauth_refresh_one_shot_boundary.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          compose = json.loads(Path("automation/command_bus/claude_gate_compose.yaml").read_text())
          assert "oauth-refresh-helper" not in compose["services"]
          assert "claude-auth:/home/node/.claude" not in Path("automation/command_bus/claude_oauth_refresh_one_shot_boundary.mjs").read_text()
          print("PERSISTENT_COMPOSE_CREDENTIAL_FREE_PASS")
          PY
          git diff --check
