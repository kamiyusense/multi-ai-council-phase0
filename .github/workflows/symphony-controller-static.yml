name: Symphony-inspired controller static validation

on:
  pull_request:
    paths:
      - automation/command_bus/symphony_controller.py
      - automation/command_bus/symphony_autonomous_policy.py
      - automation/command_bus/symphony_autonomous_runtime.py
      - automation/command_bus/symphony_autonomous_controller.py
      - automation/command_bus/symphony_campaign_store.py
      - automation/command_bus/symphony_attempt_store.py
      - automation/command_bus/symphony_attempt_reconciler.py
      - automation/command_bus/symphony_result_adoption.py
      - automation/command_bus/symphony_result_manifest.py
      - automation/command_bus/symphony_git_adoption.py
      - automation/command_bus/tests/test_symphony_g6_adoption.py
      - automation/command_bus/tests/symphony_g6_fixtures.py
      - automation/command_bus/tests/fixtures/symphony_g6/**
      - automation/command_bus/symphony_github_git_transport.py
      - automation/command_bus/symphony_github_readers.py
      - automation/command_bus/symphony_workspace_snapshot.py
      - automation/command_bus/symphony_result_verification.py
      - automation/command_bus/symphony_g63*.py
      - automation/command_bus/tests/test_symphony_g63_connection.py
      - automation/command_bus/tests/test_symphony_g7_static.py
      - automation/command_bus/scripts/validate_symphony_g63.py
      - docs/SYMPHONY_G63*.md
      - docs/SYMPHONY_G7_STATIC_CHECKPOINT.md
      - docs/evidence/symphony-g63-static/**
      - automation/command_bus/symphony_g62_prepare.py
      - automation/command_bus/symphony_g62_attestation.py
      - automation/command_bus/tests/test_symphony_g62_readiness.py
      - automation/command_bus/tests/fixtures/symphony_g62/**
      - automation/command_bus/scripts/validate_symphony_g62.py
      - docs/SYMPHONY_G62_STATIC_READINESS_CHECKPOINT.md
      - docs/SYMPHONY_G62_LOCAL_LIVE_PREFLIGHT.md
      - docs/evidence/symphony-g62-static/**
      - automation/command_bus/symphony_g61_wiring.py
      - automation/command_bus/scripts/symphony_g61_readonly_smoke.py
      - automation/command_bus/tests/test_symphony_g61_production_wiring.py
      - automation/command_bus/tests/symphony_g61_github_sim.py
      - automation/command_bus/tests/fixtures/symphony_g61/**
      - docs/SYMPHONY_G61_PRODUCTION_WIRING_STATIC_CHECKPOINT.md
      - docs/evidence/symphony-g61-static/**
      - docs/SYMPHONY_G6_STATIC_CHECKPOINT.md
      - docs/SYMPHONY_G6_LOCAL_LIVE_PLAN.md
      - docs/evidence/symphony-g6-static/**
      - automation/command_bus/symphony_subscription_boundary.py
      - automation/command_bus/symphony_upstream_event_adapter.py
      - automation/command_bus/symphony_production_observer.py
      - automation/command_bus/symphony_g5_observer_cli.py
      - automation/command_bus/symphony_g5_observer.patch
      - automation/command_bus/symphony_upstream_reference.json
      - automation/command_bus/symphony_codex_app_server.py
      - automation/command_bus/symphony_github_adapter.py
      - automation/command_bus/symphony_live_store.py
      - automation/command_bus/evidence/**
      - automation/command_bus/tests/test_symphony_controller.py
      - automation/command_bus/tests/test_symphony_autonomous_runtime.py
      - automation/command_bus/tests/test_symphony_autonomous_controller.py
      - automation/command_bus/tests/test_symphony_campaign_store.py
      - automation/command_bus/tests/test_symphony_attempt_store.py
      - automation/command_bus/tests/test_symphony_attempt_reconciler.py
      - automation/command_bus/tests/test_symphony_result_adoption.py
      - automation/command_bus/tests/test_symphony_subscription_boundary.py
      - automation/command_bus/tests/test_symphony_attempt_faults.py
      - automation/command_bus/tests/test_symphony_upstream_event_adapter.py
      - automation/command_bus/tests/test_symphony_production_observer.py
      - automation/command_bus/tests/test_symphony_g51_worker_lifecycle.py
      - automation/command_bus/tests/fixtures/symphony_g51/**
      - automation/command_bus/scripts/validate_symphony_g51.py
      - automation/command_bus/tests/test_symphony_upstream_reference.py
      - automation/command_bus/tests/test_symphony_minimal_live_preflight.py
      - automation/command_bus/README.md
      - docs/SYMPHONY_INSPIRED_MINIMAL_ORCHESTRATOR.md
      - docs/SYMPHONY_UPSTREAM_REUSE_MATRIX.md
      - docs/SYMPHONY_MINIMAL_LIVE_PROOF_ISSUE.md
      - docs/SYMPHONY_MINIMAL_LIVE_PROOF_WORKFLOW.md
      - docs/SYMPHONY_MINIMAL_LIVE_PROOF_RUNBOOK.md
      - docs/SYMPHONY_MINIMAL_LIVE_PROOF_STATIC_CHECKPOINT.md
      - docs/SYMPHONY_G5_PRODUCTION_OBSERVATION_BRIDGE.md
      - docs/SYMPHONY_G5_LIVE_PROOF_WORKFLOW.md
      - docs/SYMPHONY_G5_LIVE_PROOF_ISSUE.md
      - .github/workflows/symphony-controller-static.yml

permissions:
  contents: read

concurrency:
  group: symphony-controller-static-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Focused controller tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/symphony-static-evidence"
          python -m unittest automation.command_bus.tests.test_symphony_controller automation.command_bus.tests.test_symphony_autonomous_runtime automation.command_bus.tests.test_symphony_autonomous_controller automation.command_bus.tests.test_symphony_campaign_store automation.command_bus.tests.test_symphony_attempt_store automation.command_bus.tests.test_symphony_attempt_reconciler automation.command_bus.tests.test_symphony_result_adoption automation.command_bus.tests.test_symphony_g6_adoption automation.command_bus.tests.test_symphony_g61_production_wiring automation.command_bus.tests.test_symphony_g62_readiness automation.command_bus.tests.test_symphony_g63_connection automation.command_bus.tests.test_symphony_g7_static automation.command_bus.tests.test_symphony_subscription_boundary automation.command_bus.tests.test_symphony_attempt_faults automation.command_bus.tests.test_symphony_upstream_event_adapter automation.command_bus.tests.test_symphony_production_observer automation.command_bus.tests.test_symphony_g51_worker_lifecycle automation.command_bus.tests.test_symphony_upstream_reference automation.command_bus.tests.test_symphony_minimal_live_preflight -v 2>&1 | tee "$RUNNER_TEMP/symphony-static-evidence/focused-tests.txt"

      - name: Full command bus regression suite
        run: |
          set -o pipefail
          python -m unittest discover -s automation/command_bus/tests -t . -v 2>&1 | tee "$RUNNER_TEMP/symphony-static-evidence/full-tests.txt"

      - name: Validate immutable G6.2 historical evidence
        run: python -m automation.command_bus.scripts.validate_symphony_g63 --historical-only

      - name: Validate G6.3 sealed evidence and OFF boundary
        run: python -m automation.command_bus.scripts.validate_symphony_g63

      - name: Compile command bus
        run: python -m compileall -q automation/command_bus

      - name: Check exact PR diff
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Record exact head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          evidence_dir="$RUNNER_TEMP/symphony-static-evidence"
          mkdir -p "$evidence_dir"
          cat > "$evidence_dir/evidence.json" <<EOF
          {
            "schema_version": 1,
            "repository": "${GITHUB_REPOSITORY}",
            "workflow_run_id": "${RUN_ID}",
            "exact_head": "${HEAD_SHA}",
            "focused_controller_tests": "PASS",
            "full_command_bus_tests": "PASS",
            "compileall": "PASS",
            "diff_check": "PASS",
            "live_model_count": 0,
            "live_provider_count": 0
          }
          EOF
          (cd "$evidence_dir" && sha256sum evidence.json > evidence.sha256)
          {
            echo "## Symphony-inspired controller static validation"
            echo "- exact PR head: \`${HEAD_SHA}\`"
            echo "- focused tests: PASS if this job is green"
            echo "- command bus regression: PASS if this job is green"
            echo "- compileall: PASS if this job is green"
            echo "- diff check: PASS if this job is green"
            echo "- live model/provider execution: not invoked"
            echo "- evidence SHA-256: \`$(awk '{print $1}' "$evidence_dir/evidence.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload static evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symphony-static-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/symphony-static-evidence/
          if-no-files-found: error
          retention-days: 30
