name: Issue 110 OAuth refresh generation local TLS E2E

on:
  push:
    branches:
      - prepare/issue110-oauth-refresh-generation-local-tls-e2e-v1
    paths:
      - .github/workflows/issue110-oauth-refresh-generation-local-tls-e2e.yml
      - automation/command_bus/claude_oauth_refresh_helper.mjs
      - automation/command_bus/claude_oauth_refresh_transport.mjs
      - automation/command_bus/claude_oauth_refresh_generation.mjs
      - automation/command_bus/claude_oauth_refresh_generation_state.mjs
      - automation/command_bus/tests/test_claude_oauth_refresh_generation_local_tls_e2e.mjs

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact E2E head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Run synthetic generation + local TLS E2E
        shell: bash
        run: node --test automation/command_bus/tests/test_claude_oauth_refresh_generation_local_tls_e2e.mjs

      - name: Verify production code was not added by this E2E
        shell: bash
        run: |
          node --check automation/command_bus/tests/test_claude_oauth_refresh_generation_local_tls_e2e.mjs
          git diff --check
          echo "OAUTH_REFRESH_GENERATION_LOCAL_TLS_E2E_TEST_ONLY_PASS"
