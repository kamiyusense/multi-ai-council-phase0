{
  "x-phase0-runtime-contract": {
    "mode": "runnable-packaging-static-unexecuted",
    "argv": ["-p", "--safe-mode", "--no-session-persistence", "--max-turns", "1", "--tools", "", "--mcp-config", "{\"mcpServers\":{}}", "--strict-mcp-config", "--permission-prompts", "none"],
    "automatic_model_fallback": "not_proven_disabled; the Admission Gate is the one-upstream-request boundary",
    "tool_scope": "all_builtin_tools_disabled; MCP denied by separate config requirement",
    "live_execution_gate": "PHASE0_LIVE_EXECUTION=1 plus dispatch metadata; absent from Compose environment",
    "default_launcher_result": "BLOCKED"
  },
  "services": {
    "claude": {
      "image": "phase0-claude-runtime:2.1.283",
      "build": {"context": ".", "dockerfile": "docker/claude-runtime/Dockerfile"},
      "profiles": ["human-approval-required"],
      "entrypoint": ["node", "/opt/phase0/claude_runtime_launcher.mjs"],
      "privileged": false,
      "security_opt": ["seccomp=./docker/claude-runtime/claude-bwrap-seccomp-amd64.json"],
      "ports": [],
      "networks": ["internal"],
      "environment": {
        "ANTHROPIC_BASE_URL": "http://gate:8080",
        "HTTPS_PROXY": "http://auth-control-proxy:3128",
        "CLAUDE_CODE_PROXY_RESOLVES_HOSTS": "1",
        "PHASE0_TRANSPORT_MODE": "CONTAINER_INTERNAL",
        "CLAUDE_CODE_MAX_RETRIES": "0",
        "CLAUDE_CODE_MAX_TURNS": "1",
        "CLAUDE_CONFIG_DIR": "/home/node/.claude",
        "CLAUDE_CODE_SKIP_PROMPT_HISTORY": "1",
        "CLAUDE_CODE_RESUME_INTERRUPTED_TURN": "0",
        "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1",
        "CLAUDE_CODE_DISABLE_AGENT_VIEW": "1",
        "CLAUDE_AGENT_SDK_DISABLE_BUILTIN_AGENTS": "1",
        "CLAUDE_CODE_DISABLE_FAST_MODE": "1",
        "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB": "1",
        "CLAUDE_CODE_DISABLE_NONSTREAMING_FALLBACK": "1",
        "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
        "DISABLE_UPDATES": "1"
      },
      "user": "1000:1000",
      "volumes": ["claude-auth:/home/node/.claude"]
    },
    "auth-control-proxy": {
      "image": "phase0-claude-auth-control-proxy:1",
      "build": {"context": ".", "dockerfile": "docker/auth-control-plane/Dockerfile"},
      "profiles": ["human-approval-required"],
      "entrypoint": ["node", "/opt/phase0/auth_control_plane_proxy.mjs"],
      "privileged": false,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "ports": [],
      "networks": {"internal": {}, "egress": {}},
      "user": "1000:1000"
    },
    "auth-bootstrap": {
      "image": "phase0-claude-runtime:2.1.283",
      "build": {"context": ".", "dockerfile": "docker/claude-runtime/Dockerfile"},
      "profiles": ["human-auth-bootstrap"],
      "entrypoint": ["claude"],
      "command": ["auth", "login"],
      "privileged": false,
      "ports": [],
      "networks": ["egress"],
      "user": "1000:1000",
      "environment": {
        "CLAUDE_CONFIG_DIR": "/home/node/.claude",
        "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
        "DISABLE_UPDATES": "1"
      },
      "volumes": ["claude-auth:/home/node/.claude"]
    },
    "gate": {
      "image": "phase0-claude-gate:1",
      "build": {"context": ".", "dockerfile": "docker/admission-gate/Dockerfile"},
      "profiles": ["human-approval-required"],
      "entrypoint": ["python3", "/opt/phase0/gate_entrypoint.py"],
      "command": ["serve"],
      "privileged": false,
      "ports": [],
      "user": "1000:1000",
      "networks": {
        "internal": {"ipv4_address": "172.29.247.2"},
        "egress": {}
      },
      "environment": {
        "PHASE0_GATE_MODE": "OPEN_EXISTING_ONLY",
        "PHASE0_GATE_BIND": "172.29.247.2",
        "PHASE0_GATE_PORT": "8080",
        "PHASE0_GATE_STATE_DIR": "/var/lib/phase0/claude-gate",
        "PHASE0_GATE_EXPECTED_STORE_ID": "${PHASE0_GATE_EXPECTED_STORE_ID:?must be externally provisioned}",
        "PHASE0_GATE_UPSTREAM_URL": "https://api.anthropic.com"
      },
      "volumes": ["gate-state:/var/lib/phase0/claude-gate"]
    },
    "gate-bootstrap": {
      "image": "phase0-claude-gate:1",
      "build": {"context": ".", "dockerfile": "docker/admission-gate/Dockerfile"},
      "profiles": ["human-gate-bootstrap"],
      "entrypoint": ["python3", "/opt/phase0/gate_bootstrap_entrypoint.py"],
      "privileged": false,
      "ports": [],
      "network_mode": "none",
      "user": "1000:1000",
      "volumes": [
        "${PHASE0_GATE_CONTROL_DIR:?must be externally provisioned}:/var/lib/phase0",
        "gate-state:/var/lib/phase0/claude-gate"
      ]
    }
  },
  "networks": {
    "internal": {
      "driver": "bridge",
      "internal": true,
      "ipam": {"config": [{"subnet": "172.29.247.0/24"}]}
    },
    "egress": {"driver": "bridge"}
  },
  "volumes": {"gate-state": {}, "claude-auth": {}}
}
